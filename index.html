<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Archive</title>
<meta name="description" content="Searchable index of local newspaper events — Obituaries, People, Property, Enclosure.">
<meta name="theme-color" content="#f1ecdf">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="masthead">
      <span class="masthead-eyebrow">Parish &amp; Press Records</span>
      <h1 class="masthead-title">News Archive</h1>
    </div>
    <div class="header-status" id="statusLine">
      <span id="statusText">Loading index…</span>
      <button id="refreshBtn" class="ghost-btn" title="Refresh from spreadsheet" aria-label="Refresh">↻</button>
    </div>
  </div>
</header>

<main class="app-shell">

  <!-- ───────── Rail: search & filters ───────── -->
  <aside class="rail" id="rail">
    <div class="field-group">
      <label for="searchInput" class="field-label">Free text</label>
      <input type="search" id="searchInput" class="text-input" placeholder="Search names, notes, newspaper…" autocomplete="off">
    </div>

    <div class="field-group">
      <label for="surnameInput" class="field-label">Surname</label>
      <input type="text" id="surnameInput" class="text-input" placeholder="e.g. Attwood" autocomplete="off">
    </div>

    <div class="field-group field-row">
      <div>
        <label for="yearFrom" class="field-label">Year from</label>
        <input type="number" id="yearFrom" class="text-input" placeholder="e.g. 1850" inputmode="numeric" min="1000" max="2100" step="1">
      </div>
      <div>
        <label for="yearTo" class="field-label">Year to</label>
        <input type="number" id="yearTo" class="text-input" placeholder="e.g. 1950" inputmode="numeric" min="1000" max="2100" step="1">
      </div>
    </div>

    <div class="field-group">
      <span class="field-label">Category</span>
      <div class="chip-row" id="categoryChips">
        <button class="chip is-active" data-category="">All</button>
      </div>
    </div>

    <div class="field-group">
      <label for="sortSelect" class="field-label">Sort by</label>
      <select id="sortSelect" class="text-input">
        <option value="date-desc">Date, newest first</option>
        <option value="date-asc">Date, oldest first</option>
        <option value="surname-asc">Surname, A–Z</option>
        <option value="surname-desc">Surname, Z–A</option>
      </select>
    </div>

    <button id="clearFiltersBtn" class="text-btn">Clear filters</button>

    <div class="rail-count" id="resultCount" aria-live="polite"></div>
  </aside>

  <!-- ───────── Index list ───────── -->
  <section class="index-pane" id="indexPane" aria-label="Event index">
    <div id="cardList" class="card-list"></div>
    <div id="emptyState" class="empty-state" hidden>
      <p>No entries match those filters.</p>
      <button id="emptyClearBtn" class="text-btn">Clear filters</button>
    </div>
  </section>

  <!-- ───────── Detail panel (desktop) / full screen (mobile) ───────── -->
  <section class="detail-pane" id="detailPane" aria-label="Entry detail">
    <div class="detail-placeholder" id="detailPlaceholder">
      <p>Select an entry from the index to view its record card.</p>
    </div>
    <article class="record-card" id="recordCard" hidden>
      <button class="close-detail" id="closeDetailBtn" aria-label="Close entry">←</button>
      <div class="record-stamp" id="recordCategory"></div>
      <h2 class="record-name" id="recordName"></h2>
      <div class="record-meta-grid">
        <div><span class="meta-label">Date</span><span class="meta-value" id="recordDate"></span></div>
        <div><span class="meta-label">Newspaper</span><span class="meta-value" id="recordNewspaper"></span></div>
        <div><span class="meta-label">ID</span><span class="meta-value mono" id="recordId"></span></div>
      </div>
      <div class="record-image-wrap" id="recordImageWrap" hidden>
        <img id="recordImage" alt="" loading="lazy">
      </div>
      <div class="record-notes-wrap" id="recordNotesWrap" hidden>
        <span class="meta-label">Notes</span>
        <p class="record-notes" id="recordNotes"></p>
      </div>
      <div class="record-footer">
        <span id="recordSubmitted"></span>
      </div>
    </article>
  </section>

</main>

<div id="toast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
